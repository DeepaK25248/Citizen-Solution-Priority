services:
  - type: web
    name: citysolution
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 20 --timeout 0 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
    envVars:
      - key: CITYSOLUTION_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CITYSOLUTION_UPLOAD_DIR
        value: /tmp/uploads
      - key: CITYSOLUTION_SECRET_KEY
        generateValue: true
      - key: CITYSOLUTION_AUTHORITY_USERNAME
        sync: false
      - key: CITYSOLUTION_AUTHORITY_PASSWORD
        sync: false